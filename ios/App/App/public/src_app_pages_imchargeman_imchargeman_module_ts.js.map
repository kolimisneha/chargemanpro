export default "<app-header\n  title=\"My Stations\"\n  redirectTo=\"dashboard\"\n  iconPath=\"../../../assets/icon/back_icon.svg\"\n  ionicIconName =\"add-circle\"\n  (onSecondaryIconClick) = \"openChargerRegistrationForm()\"\n></app-header>\n\n<ion-content content-color>\n  \n  <app-loading *ngIf=\"isLoading\" [showProgress]=\"showProgress\" [statusText]=\"statusText\"></app-loading>\n  <div *ngIf=\"!isLoading\">\n    <div (click)=\"openChargemanDetails(station)\" chargeman-details-container *ngFor=\"let station of chargeStations\">\n      <div image-container>\n        <div name-container>\n          <ion-label station-name>{{station.hostname}}</ion-label>\n          <ion-icon *ngIf=\"station.active === '1'\" [src]=\"station.chargeCount === '0' ? greenDotIcon : redDotIcon\"></ion-icon>\n        </div>\n        <ion-label device-id>{{station.deviceid}}</ion-label>\n        <div charge-active-container>\n          <ion-label charger-type>{{station.chargettype}}</ion-label>\n          <ion-label charger-type>{{station.active === '1' ? 'Active' : 'Disabled'}}</ion-label>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <!-- <ion-fab slot=\"fixed\" vertical=\"bottom\" horizontal=\"end\" slot=\"fixed\">\n    <ion-fab-button chargeman-fab-button (click)=\"openChargerRegistrationForm()\">\n      <ion-icon [src]=\"addIcon\"></ion-icon>\n    </ion-fab-button>\n  </ion-fab> -->\n</ion-content>\n";
