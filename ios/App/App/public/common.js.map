export default "\n\n<!-- \n<app-header [title]=\"hostChargerTitle\"\nredirectTo=\"chargemen-list\"\niconPath=\"../../../assets/icon/back_icon.svg\"\n[secondaryIconPath]=\"setEdit ? '../../../assets/icon/edit_icon.svg' : ''\"\n(onSecondaryIconClick)=\"editClickHandler()\">\n</app-header> -->\n\n<ion-tabs #chargerdetails (ionTabsWillChange)=\"onTabChange($event)\">\n  <ion-tab-bar slot=\"bottom\">\n    <ion-tab-button tab=\"charger-details\">\n      <ion-icon name=\"list-outline\"></ion-icon>\n      <ion-label>Details</ion-label>\n    </ion-tab-button>\n\n    <ion-tab-button tab=\"charger-history\">\n      <ion-icon name=\"return-up-back-outline\"></ion-icon>\n      <ion-label>History</ion-label>\n    </ion-tab-button>\n  </ion-tab-bar>\n</ion-tabs>\n";
