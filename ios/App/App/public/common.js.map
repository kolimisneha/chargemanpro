export default "<ion-header>\n  <ion-toolbar toolbar-style>\n    <ion-buttons slot=\"start\" header-button>\n      <!-- <ion-back-button [icon]=\"iconPath\"></ion-back-button> -->\n      <ion-icon header-back-button (click)=\"backButtonClickHander()\" [src]=\"iconPath\"></ion-icon>\n    </ion-buttons>\n    <ion-title header-title>{{title}}</ion-title>\n    <ion-buttons slot=\"end\" *ngIf=\"secondaryIconPath\" >\n      <!-- <ion-back-button [icon]=\"iconPath\"></ion-back-button> -->\n      <ion-icon header-secondary-button (click)=\"secondaryIconClickHandler()\" [src]=\"secondaryIconPath\"></ion-icon>\n    </ion-buttons>\n\n    <ion-buttons slot=\"end\" *ngIf=\"ionicIconName\" >\n      <!-- <ion-back-button [icon]=\"iconPath\"></ion-back-button> -->\n      <ion-icon ionic-icon-secondary-button (click)=\"secondaryIconClickHandler()\" [name]=\"ionicIconName\"></ion-icon>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n";
