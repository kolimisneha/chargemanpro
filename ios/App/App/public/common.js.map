export default "<ion-content overflow-scroll=\"false\">\n  <div recharge-container>\n    <form [formGroup]=\"manualChargeForm\" (ngSubmit)=\"submitDeviceId()\">\n    <ion-item>\n      <div manual-entry-container>\n        <div>\n          <ion-label deviceid-label position=\"stacked\">Device ID (10 digit code)</ion-label>\n          <ion-input (keypress)=\"onKeypress($event)\" formControlName=\"deviceid\" type=\"text\" recharge-input></ion-input>\n        </div>\n        \n        <div (click)=\"openQrScanner()\">\n          <ion-icon [src]=\"scanIcon\"></ion-icon>\n        </div>\n    </div>\n\n    </ion-item>\n    <div>\n    \n    </div>\n    <div error-container>\n      <span *ngIf=\"(manualChargeForm.controls.deviceid.touched || submitted) && manualChargeForm.controls.deviceid.errors?.required\"> Device ID Required </span>\n      <span *ngIf=\"(manualChargeForm.controls.deviceid.touched || submitted) && manualChargeForm.controls.deviceid.errors?.minlength\">Device ID mustbe in 10 character length</span>\n      <span *ngIf=\"(manualChargeForm.controls.deviceid.touched || submitted) && manualChargeForm.controls.deviceid.errors?.maxlength\">Device ID mustbe in 10 character length</span>\n      </div>\n    \n      <div button-container>\n        <ion-button expand=\"block\" type=\"submit\" [disabled]=\"!manualChargeForm.valid\" button-regular>Proceed</ion-button>\n      </div>\n\n    </form>\n  </div>\n\n</ion-content>\n";
