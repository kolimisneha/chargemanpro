export default "<ion-content>\n  <div recharge-container>\n    <form [formGroup]=\"rechargeForm\" (ngSubmit)=\"recharge()\" (keydown)=\"handleKeyupEnter($event)\">\n    <ion-item>\n      <ion-label recharge-label position=\"stacked\">Enter Amount</ion-label>\n      <ion-input formControlName=\"rechargeAmount\" type=\"tel\" recharge-input></ion-input>\n      <ion-icon slot=\"end\" [src]=\"rupeeIcon\"></ion-icon>\n    </ion-item>\n    <div error-container>\n      <span *ngIf=\"(rechargeForm.controls.rechargeAmount.touched || submitted) && rechargeForm.controls.rechargeAmount.errors?.required\">Amount required </span>\n      <span *ngIf=\"(rechargeForm.controls.rechargeAmount.touched || submitted) && rechargeForm.controls.rechargeAmount.errors?.pattern\">Invalid amount</span>\n      <span *ngIf=\"(rechargeForm.controls.rechargeAmount.touched || submitted) && rechargeForm.controls.rechargeAmount.errors?.minamount\">Amount range must be in ₹250 - ₹5000</span>\n      </div>\n    <div quick-money-selection-container>\n      <div *ngFor=\"let money of quickAmounts\" money-selection-box (click)=\"selectMoney(money)\">\n        ₹ {{money.amount}}\n      </div>\n      \n    </div>\n      <div button-container>\n        <ion-button expand=\"full\" type=\"submit\" [disabled]=\"!rechargeForm.valid\" button-regular>Recharge</ion-button>\n      </div>\n\n    </form>\n  </div>\n\n</ion-content>\n";
