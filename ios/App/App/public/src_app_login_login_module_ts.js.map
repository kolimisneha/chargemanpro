export default "<ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-button (click)=\"dismiss()\">\n        <ion-icon name=\"close\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n    <ion-title>Select Country</ion-title>\n  </ion-toolbar>\n  <ion-toolbar>\n    <ion-searchbar [formControl]=\"searchControl\" placeholder=\"Search country\"></ion-searchbar>\n  </ion-toolbar>\n</ion-header>\n<ion-content>\n  <ion-list>\n    <ion-item button *ngFor=\"let country of filteredCountries\" (click)=\"selectCountry(country)\">\n      <ion-label>{{country.name}} <span text-light>({{country.dial_code}})</span></ion-label>\n    </ion-item>\n    <ion-item *ngIf=\"filteredCountries.length === 0\">\n      <ion-label>No countries found</ion-label>\n    </ion-item>\n  </ion-list>\n</ion-content>\n";
