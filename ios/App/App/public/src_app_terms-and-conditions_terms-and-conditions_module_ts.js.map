export default "<app-header title=\"Terms & Conditions\" [redirectTo]='sourcePage' iconPath=\"../../assets/icon/back_icon.svg\"></app-header>\n\n<ion-content content-color>\n<div terms-image-container>\n    <img src=\"../../assets/icon/loginimg.png\">\n</div>\n\n<div terms-content>\n<div heading-container>Terms & Conditions</div>\n\n<div terms-points-heading>\n  <p>By downloading or using the app, these terms will automatically apply to you</p> <p>you should make sure therefore that you read them carefully before using the app.</p>\n</div>\n<div terms-points>\n  <li *ngFor=\"let point of termsPoints\">{{point}}</li>\n</div>\n</div>\n</ion-content>\n";
