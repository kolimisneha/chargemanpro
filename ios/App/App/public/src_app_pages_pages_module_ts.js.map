export default "<ion-app>\n  <ion-split-pane contentId=\"main-content\">\n    <ion-menu contentId=\"main-content\" type=\"overlay\">\n      <ion-content menu-content>\n        <ion-list id=\"inbox-list\" menu-list>\n          <ion-menu-toggle auto-hide=\"false\">\n            <div profile-container>\n              <img [src]=\"menuAvatarIcon\"/>\n\n              <div profile-name-container (click)=\"openProfile()\">\n                <ion-label>Profile</ion-label>\n                <ion-icon [src]=\"profileIcon\"></ion-icon>\n                <div>\n                <ion-label>{{userName}}</ion-label>\n              </div>\n              </div>\n            </div>\n           \n            <ion-item *ngFor=\"let item of menuItems\" lines=\"none\" (click)=\"routeTo(item.url)\">\n              <ion-label>{{item.title}}</ion-label>\n              <ion-icon [src]=\"item.icon\" slot=\"end\"></ion-icon>\n            </ion-item>\n            <ion-item lines=\"none\" (click)=\"logout()\">\n              <ion-label>Logout</ion-label>\n              <ion-icon [src]=\"logoutIcon\" slot=\"end\"></ion-icon>\n            </ion-item>\n          </ion-menu-toggle>\n        </ion-list>\n      </ion-content>\n      <div menu-footer-image-container>\n      <img src=\"../../assets/icon/menu_bottom_logo.svg\"/>\n    </div>\n    <div version-container>\n      <ion-label>V {{appVersionNumber}}</ion-label>\n    </div>\n    </ion-menu>\n    <ion-router-outlet id=\"main-content\"></ion-router-outlet>\n  </ion-split-pane>\n</ion-app>\n\n";
