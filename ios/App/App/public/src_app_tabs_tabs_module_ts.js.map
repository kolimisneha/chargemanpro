export default "<ion-header [translucent]=\"true\">\n  <ion-toolbar id=\"toolbar\" chargemen-toolbar-style>\n    \n    <ion-buttons slot=\"start\">\n      <ion-menu-button>\n        <ion-icon sidemenuIcon [src]=\"appIconSrc\"></ion-icon>\n      </ion-menu-button>\n    </ion-buttons>\n    <ion-searchbar (ionChange)=\"filterItems($event)\" [search-icon]=\"\" searchbar-style *ngIf=\"enableSearch\"></ion-searchbar>\n    <ion-buttons slot=\"end\">\n      <div chargemen-button-container>\n        <!-- <ion-icon [src]=\"cartIconSrc\"></ion-icon> -->\n        <img (click)=\"openManualEntrySheet()\" icon-hand src=\"../../assets/icon/manual_entry.png\"/>\n      </div>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n<ion-tabs #tabs class=\"home-tabs\" (ionTabsWillChange)=\"onTabChange($event)\">\n  <ion-tab-bar home-tab-bar slot=\"bottom\">\n    <ion-tab-button tab=\"map\" home-tab-buttons>\n      <ion-icon home-tab-icon src=\"../../assets/icon/tab-home.svg\"></ion-icon>\n      <ion-label home-tab-label>Home</ion-label>\n    </ion-tab-button>\n\n    <ion-tab-button tab=\"history\" home-tab-buttons>\n      <ion-icon home-tab-icon src=\"../../assets/icon/history.svg\"></ion-icon>\n      <ion-label home-tab-label>History</ion-label>\n    </ion-tab-button>\n\n    <div tab-spacer></div>\n\n    <ion-tab-button tab=\"support\" home-tab-buttons>\n      <ion-icon home-tab-icon src=\"../../assets/icon/support.svg\"></ion-icon>\n      <ion-label home-tab-label>Support</ion-label>\n    </ion-tab-button>\n\n    <ion-tab-button home-tab-buttons (click)=\"openShop()\">\n      <ion-icon home-tab-icon src=\"../../assets/icon/shop.svg\"></ion-icon>\n      <ion-label home-tab-label>Shop</ion-label>\n    </ion-tab-button>\n  </ion-tab-bar>\n</ion-tabs>\n\n<ion-fab slot=\"fixed\" vertical=\"bottom\" horizontal=\"center\" slot=\"fixed\">\n  <ion-fab-button home-fab-button (click)=\"openScanner()\">\n    <!-- <ion-icon class=\"qr-style\" src=\"../../assets/icon/qr_scanner.svg\"></ion-icon> -->\n    <ion-icon [ngClass]=\"!showCharger ? 'qr-style' : 'charger-style'\" [src]=\"!showCharger ?  qr_scanner : chargeEnergy\"></ion-icon>\n  </ion-fab-button>\n</ion-fab>\n\n";
