export default "<app-header title=\"Support\" redirectTo='dashboard' iconPath=\"../../../assets/icon/back_icon.svg\"></app-header>\n\n\n<ion-content content-color>\n  \n  <div support-container>\n    <ion-item lines=\"none\" support-item (click)=\"openSupport('email')\">    \n    <ion-label>{{chargemenEmail}}</ion-label>\n    <ion-icon name=\"mail-outline\" slot=\"start\"></ion-icon>\n  </ion-item>\n\n  <ion-item lines=\"none\" support-item (click)=\"openSupport('call')\">    \n    <ion-label>{{chargemenContact}}</ion-label>\n    <ion-icon name=\"call-outline\" slot=\"start\"></ion-icon>\n  </ion-item>\n\n  <ion-item lines=\"none\" support-item (click)=\"openSupport('website')\">    \n    <ion-label>{{chargeManWebSite}}</ion-label>\n    <ion-icon name=\"information-circle-outline\" slot=\"start\"></ion-icon>\n  </ion-item>\n\n  <ion-item lines=\"none\" support-item (click)=\"openSupport('terms')\">    \n    <ion-label>Terms & Conditions</ion-label>\n    <ion-icon name=\"document-text-outline\" slot=\"start\"></ion-icon>\n  </ion-item>\n\n  <ion-item lines=\"none\" support-item (click)=\"openSupport('privacy')\">    \n    <ion-label>Our Privacy Policy</ion-label>\n    <ion-icon name=\"document-text-outline\" slot=\"start\"></ion-icon>\n  </ion-item>\n  </div>\n\n</ion-content>\n";
