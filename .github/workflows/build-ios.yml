name: Build & Upload iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  BUNDLE_ID: evchargeman.io
  APPLE_ID: ${{ secrets.APPLE_ID || 'director@evgracias.com' }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'QDG4B42LM2' }}
  FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_API_KEY }}
  SPACESHIP_CONNECT_API_IN_HOUSE: 'false'
  APP_STORE_CERT_P12: ${{ secrets.APP_STORE_CERT_P12 }}
  APP_STORE_CERT_P12_PASSWORD: ${{ secrets.APP_STORE_CERT_P12_PASSWORD }}
  APP_STORE_PROFILE_B64: ${{ secrets.APP_STORE_PROFILE_B64 }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build -- --prod

      - name: Patch Capacitor iOS template to iOS 15
        run: |
          set -e
          ARCH="$RUNNER_TEMP/ios-template"
          mkdir -p "$ARCH"
          cd node_modules/@capacitor/cli/assets
          tar xzf ios-template.tar.gz -C "$ARCH"
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '15.0'/" "$ARCH/App/Podfile"
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" "$ARCH/App/App.xcodeproj/project.pbxproj"
          grep -n "platform :ios" "$ARCH/App/Podfile"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 15.0" "$ARCH/App/App.xcodeproj/project.pbxproj"
          tar czf ios-template.tar.gz -C "$ARCH" .
          echo "template patched to iOS 15"

      - name: Add iOS platform
        run: npx cap add ios

      - name: Force deployment target 15.0 and verify
        run: |
          echo "WORKFLOW_COMMIT=$(git rev-parse --short HEAD)"
          cp fastlane/ios-Podfile.template ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" ios/App/App.xcodeproj/project.pbxproj
          echo "=== Podfile platform line (must be 15.0): ==="
          grep "platform :ios" ios/App/Podfile
          echo "=== Podfile head: ==="
          cat ios/App/Podfile
          echo "=== pbxproj deployment targets: ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj
          test "$(grep -c 'platform :ios, .15.0.' ios/App/Podfile)" = "1" || { echo "FAIL: Podfile platform is not 15.0"; exit 1; }

      - name: Sync iOS (pod install)
        run: npx cap sync ios

      - name: Dump Podfile state after sync (runs even on failure)
        if: always()
        run: |
          echo "=== Podfile content at end of run: ==="
          cat ios/App/Podfile
          echo "=== pbxproj deployment targets: ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj

      - name: Upload debug files (runs even on failure)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-debug-files
          path: |
            ios/App/Podfile
            ios/App/App.xcodeproj/project.pbxproj
          if-no-files-found: error

      - name: Set up Fastlane
        run: |
          if ! command -v fastlane &>/dev/null; then gem install fastlane -NV; fi
          fastlane --version

      - name: Install signing identity (or generate a new one)
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          KEYCHAIN_PASSWORD: build
        run: |
          set -e
          if [ -z "$APP_STORE_CONNECT_API_KEY_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_KEY" ]; then
            echo "::error::Missing App Store Connect API key secrets (ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY). Create an API key at appstoreconnect.apple.com -> Users and Access -> Integrations -> App Store Connect API, then add these 3 repo secrets."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          if [ -n "$APP_STORE_CERT_P12" ]; then
            echo "Reusing existing certificate and provisioning profile from secrets."
            echo "$APP_STORE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            P12_PASS="${APP_STORE_CERT_P12_PASSWORD:-$KEYCHAIN_PASSWORD}"
            if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$P12_PASS" -noout 2>/dev/null; then
              echo "::error::APP_STORE_CERT_P12 secret is invalid or truncated. Re-copy the ENTIRE p12 base64 line from the run log (it starts with 'LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQ' and ends with '=='), then update the secret and re-run."
              exit 1
            fi
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_FILE="$HOME/Library/MobileDevice/Provisioning Profiles/EVChargeMan_AppStore.mobileprovision"
            echo "$APP_STORE_PROFILE_B64" | base64 --decode > "$PROFILE_FILE"
          else
            echo "Generating new certificate and provisioning profile with Fastlane..."
            export KEYCHAIN_PATH="$KEYCHAIN"
            fastlane generate_signing
            PROFILE_FILE="$(ls certificates/*.mobileprovision | head -1)"
            mkdir -p "$RUNNER_TEMP/certs_out"
            cp certificates/*.p12 certificates/*.mobileprovision "$RUNNER_TEMP/certs_out/"
            echo "===== COPY THIS P12 BASE64 (password: $KEYCHAIN_PASSWORD) ====="
            openssl base64 -A -in certificates/*.p12
            echo ""
            echo "===== COPY THIS PROFILE BASE64 ====="
            openssl base64 -A -in "$PROFILE_FILE"
            echo ""
          fi

          SPECIFIER="$(security cms -D -i "$PROFILE_FILE" 2>/dev/null | plutil -extract Name raw -)"
          echo "PROFILE_SPECIFIER=$SPECIFIER" >> "$GITHUB_ENV"

      - name: Save generated signing files for reuse (first run only)
        if: env.APP_STORE_CERT_P12 == ''
        uses: actions/upload-artifact@v5
        with:
          name: apple-signing-files
          path: ${{ runner.temp }}/certs_out

      - name: Build .ipa and upload to App Store Connect
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
        run: |
          fastlane release

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: EVChargeMan.ipa
          path: build/*.ipa
