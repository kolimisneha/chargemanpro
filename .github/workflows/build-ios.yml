name: Build & Upload iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  BUNDLE_ID: evchargeman.io
  APP_VERSION: '1.4.0'
  APPLE_ID: ${{ secrets.APPLE_ID || 'director@evgracias.com' }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'QDG4B42LM2' }}
  FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_API_KEY }}
  SPACESHIP_CONNECT_API_IN_HOUSE: 'false'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build -- --prod

      - name: Patch Capacitor iOS template to iOS 14.0
        run: |
          set -e
          ARCH="$RUNNER_TEMP/ios-template"
          mkdir -p "$ARCH"
          cd node_modules/@capacitor/cli/assets
          tar xzf ios-template.tar.gz -C "$ARCH"
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/" "$ARCH/App/Podfile"
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" "$ARCH/App/App.xcodeproj/project.pbxproj"
          grep -n "platform :ios" "$ARCH/App/Podfile"
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 14.0" "$ARCH/App/App.xcodeproj/project.pbxproj"
          tar czf ios-template.tar.gz -C "$ARCH" .
          echo "template patched to iOS 14.0"

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate app icons from resources into template icon set
        run: |
          ICON_SRC="$GITHUB_WORKSPACE/resources/icon.png"
          SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -d "$SET" || { echo "FAIL: no AppIcon.appiconset at $SET"; exit 1; }
          for f in "$SET"/AppIcon-*.png; do
            base=$(basename "$f")
            size=$(echo "$base" | sed -E 's/AppIcon-([^@]+)@.*/\1/')
            if echo "$size" | grep -q 'x'; then
              w=$(echo "$size" | cut -dx -f1)
              h=$(echo "$size" | cut -dx -f2)
            else
              w="$size"
              h="$size"
            fi
            s=$(echo "$base" | sed -E 's/.*@([0-9]+)x.*/\1/')
            pw=$(awk -v a="$w" -v b="$s" 'BEGIN{printf "%d", a*b+0.5}')
            ph=$(awk -v a="$h" -v b="$s" 'BEGIN{printf "%d", a*b+0.5}')
            sips -z "$ph" "$pw" "$ICON_SRC" --out "$f" >/dev/null
            echo "generated $base -> ${pw}x${ph}"
          done
          echo "=== AppIcon set after generation: ==="
          ls "$SET" | grep -c "\.png$" | xargs echo "icon PNGs:"
          grep -c '"filename"' "$SET/Contents.json" | xargs echo "Contents.json entries:"

      - name: Configure version, permissions, and code signing
        run: |
          set -e
          echo "WORKFLOW_COMMIT=$(git rev-parse --short HEAD)"
          cp fastlane/ios-Podfile.template ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" ios/App/App.xcodeproj/project.pbxproj
          BUILD_NUMBER=$(date +%s)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" ios/App/App/Info.plist
          plutil -replace CFBundleVersion -string "$BUILD_NUMBER" ios/App/App/Info.plist
          echo "=== Info.plist version keys: ==="
          plutil -extract CFBundleShortVersionString raw ios/App/App/Info.plist
          plutil -extract CFBundleVersion raw ios/App/App/Info.plist

          # Only add permission descriptions the app actually uses
          plutil -insert NSCameraUsageDescription -string "Used to scan QR codes on charging stations and to include photos in charging reports." ios/App/App/Info.plist
          plutil -insert NSPhotoLibraryUsageDescription -string "Used to select photos of charging stations to include in reports." ios/App/App/Info.plist
          plutil -insert NSLocationWhenInUseUsageDescription -string "Used to find nearby charging stations and show the distance to them." ios/App/App/Info.plist
          plutil -insert NSLocationAlwaysAndWhenInUseUsageDescription -string "Used to notify you when you are near a saved charging station." ios/App/App/Info.plist

          echo "=== Info.plist purpose strings: ==="
          plutil -extract NSCameraUsageDescription raw ios/App/App/Info.plist
          plutil -extract NSPhotoLibraryUsageDescription raw ios/App/App/Info.plist
          plutil -extract NSLocationWhenInUseUsageDescription raw ios/App/App/Info.plist
          plutil -extract NSLocationAlwaysAndWhenInUseUsageDescription raw ios/App/App/Info.plist
          echo "=== Podfile platform line (must be 14.0): ==="
          grep "platform :ios" ios/App/Podfile
          echo "=== pbxproj deployment targets: ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj
          test "$(grep -c 'platform :ios, .14.0.' ios/App/Podfile)" = "1" || { echo "FAIL: Podfile platform is not 14.0"; exit 1; }

      - name: Sync iOS (pod install)
        run: npx cap sync ios

      - name: Dump Podfile state after sync (runs even on failure)
        if: always()
        run: |
          echo "=== Podfile content at end of run: ==="
          cat ios/App/Podfile
          echo "=== pbxproj deployment targets: ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj

      - name: Upload debug files (runs even on failure)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-debug-files
          path: |
            ios/App/Podfile
            ios/App/App.xcodeproj/project.pbxproj
          if-no-files-found: warn

      - name: Set up Fastlane
        run: |
          if ! command -v fastlane &>/dev/null; then gem install fastlane -NV; fi
          fastlane --version

      - name: Generate signing certificate and provisioning profile
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          KEYCHAIN_PASSWORD: build
        run: |
          set -e
          if [ -z "$APP_STORE_CONNECT_API_KEY_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_KEY" ]; then
            echo "::error::Missing App Store Connect API key secrets (ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY). Create an API key at appstoreconnect.apple.com -> Users and Access -> Integrations -> App Store Connect API, then add these 3 repo secrets."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          export KEYCHAIN_PATH="$KEYCHAIN"
          fastlane cleanup_certs
          fastlane generate_signing
          PROFILE_FILE="$(ls certificates/*.mobileprovision | head -1)"
          mkdir -p "$RUNNER_TEMP/certs_out"
          cp certificates/*.p12 certificates/*.mobileprovision "$RUNNER_TEMP/certs_out/"
          SPECIFIER="$(security cms -D -i "$PROFILE_FILE" 2>/dev/null | plutil -extract Name raw -)"
          echo "PROFILE_SPECIFIER=$SPECIFIER" >> "$GITHUB_ENV"
          echo "Generated certificate and profile. PROFILE_SPECIFIER=$SPECIFIER"

      - name: Save generated signing files (backup artifact)
        uses: actions/upload-artifact@v5
        with:
          name: apple-signing-files
          path: ${{ runner.temp }}/certs_out
          if-no-files-found: warn

      - name: Add privacy manifest and set manual code signing on the App target only
        run: |
          ruby -e '
            require "xcodeproj"
            app_dir = "ios/App/App"
            manifest = File.join(app_dir, "PrivacyInfo.xcprivacy")
            File.write(manifest, <<~PLIST
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>NSPrivacyTracking</key>
                <false/>
                <key>NSPrivacyTrackingDomains</key>
                <array/>
                <key>NSPrivacyCollectedDataTypes</key>
                <array/>
                <key>NSPrivacyAccessedAPITypes</key>
                <array>
                  <dict>
                    <key>NSPrivacyAccessedAPIType</key>
                    <string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                    <key>NSPrivacyAccessedAPITypeReasons</key>
                    <array>
                      <string>CA92.1</string>
                    </array>
                  </dict>
                </array>
              </dict>
              </plist>
            PLIST
            )
            puts "Wrote #{manifest}"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            unless target
              raise "App target not found"
            end
            ref = target.resources_build_phase.files_references.find do |r|
              r.respond_to?(:path) && r.path.to_s == "PrivacyInfo.xcprivacy"
            end
            unless ref
              group = project.main_group["App"] || project.main_group.new_group("App")
              file_ref = group.new_file("PrivacyInfo.xcprivacy")
              target.resources_build_phase.add_file_reference(file_ref)
              puts "Added PrivacyInfo.xcprivacy to App target Resources"
            end
            target.build_configurations.each do |config|
              next unless config.name == "Release"
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
              config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              config.build_settings["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
              config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_SPECIFIER"]
            end
            project.save
            puts "Patched App target signing settings for PROFILE_SPECIFIER=#{ENV["PROFILE_SPECIFIER"]}"
          '

      - name: Build .ipa
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
        run: |
          fastlane build

      - name: Verify IPA signature and provisioning
        run: |
          set -e
          echo "=== Step 1: IPA file exists ==="
          ls -la build/EVChargeMan.ipa
          test -f build/EVChargeMan.ipa || { echo "FAIL: IPA not found"; exit 1; }

          echo "=== Step 2: Extract IPA ==="
          cd build
          rm -rf extracted
          mkdir -p extracted
          unzip -q EVChargeMan.ipa -d extracted
          test -d extracted/Payload/App.app || { echo "FAIL: Payload/App.app not found"; exit 1; }

          echo "=== Step 3: Bundle identifier ==="
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw extracted/Payload/App.app/Info.plist)
          echo "Bundle ID: $BUNDLE_ID"
          [ "$BUNDLE_ID" = "evchargeman.io" ] || { echo "FAIL: Bundle ID mismatch (expected evchargeman.io, got $BUNDLE_ID)"; exit 1; }

          echo "=== Step 4: Version ==="
          VERSION=$(plutil -extract CFBundleShortVersionString raw extracted/Payload/App.app/Info.plist)
          echo "Version: $VERSION"
          [ "$VERSION" = "1.4.0" ] || { echo "FAIL: Version mismatch (expected 1.4.0, got $VERSION)"; exit 1; }

          echo "=== Step 5: Build number ==="
          BUILD=$(plutil -extract CFBundleVersion raw extracted/Payload/App.app/Info.plist)
          echo "Build number: $BUILD"
          [ "$BUILD" -gt 2 ] || { echo "FAIL: Build number $BUILD is not greater than previous build 2"; exit 1; }

          echo "=== Step 6: Code signature verification ==="
          codesign --verify --deep --strict --verbose=4 extracted/Payload/App.app

          echo "=== Step 7: Detailed code signature info ==="
          codesign -dvvv extracted/Payload/App.app

          echo "=== Step 8: Check all embedded frameworks ==="
          if [ -d extracted/Payload/App.app/Frameworks ]; then
            find extracted/Payload/App.app/Frameworks -type f -perm -111 | while read fw; do
              echo "Verifying: $fw"
              codesign --verify --deep --strict "$fw" || { echo "FAIL: Framework signature invalid: $fw"; exit 1; }
            done
            echo "All embedded frameworks verified."
          else
            echo "No Frameworks directory (app has no embedded frameworks)."
          fi

          echo "=== Step 9: Provisioning profile ==="
          security cms -D -i extracted/Payload/App.app/embedded.mobileprovision > /tmp/profile.plist

          echo "=== Step 10: Team ID in provisioning profile ==="
          PROFILE_TEAM=$(plutil -extract TeamIdentifier.0 raw /tmp/profile.plist)
          echo "Profile Team ID: $PROFILE_TEAM"
          [ "$PROFILE_TEAM" = "QDG4B42LM2" ] || { echo "FAIL: Profile team ID mismatch (expected QDG4B42LM2, got $PROFILE_TEAM)"; exit 1; }

          echo "=== Step 11: Bundle ID in provisioning profile ==="
          PROFILE_BUNDLE=$(plutil -extract Entitlements.application-identifier raw /tmp/profile.plist)
          echo "Profile Bundle ID: $PROFILE_BUNDLE"
          [ "$PROFILE_BUNDLE" = "QDG4B42LM2.evchargeman.io" ] || { echo "FAIL: Profile bundle ID mismatch"; exit 1; }

          echo "=== Step 12: get-task-allow is false ==="
          GET_TASK=$(plutil -extract Entitlements.get-task-allow raw /tmp/profile.plist)
          echo "get-task-allow: $GET_TASK"
          [ "$GET_TASK" = "false" ] || { echo "FAIL: get-task-allow is not false"; exit 1; }

          echo "=== Step 13: Distribution provisioning (aps-environment = production) ==="
          APS_ENV=$(plutil -extract Entitlements.aps-environment raw /tmp/profile.plist)
          echo "aps-environment: $APS_ENV"
          [ "$APS_ENV" = "production" ] || { echo "FAIL: aps-environment is not production"; exit 1; }

          echo "=== Step 14: Compare binary entitlements against provisioning profile ==="
          codesign -d --entitlements :- extracted/Payload/App.app/App > /tmp/binary_entitlements.plist 2>/dev/null
          plutil -convert xml1 /tmp/binary_entitlements.plist
          plutil -extract Entitlements /tmp/profile.plist > /tmp/profile_entitlements.plist

          python3 -c "
          import plistlib, sys

          with open('/tmp/binary_entitlements.plist', 'rb') as f:
              binary = plistlib.load(f)
          with open('/tmp/profile_entitlements.plist', 'rb') as f:
              profile = plistlib.load(f)

          checks = [
              ('com.apple.developer.team-identifier', 'QDG4B42LM2'),
              ('application-identifier',            'QDG4B42LM2.evchargeman.io'),
              ('get-task-allow',                    False),
              ('aps-environment',                   'production'),
              ('keychain-access-groups',            None),
          ]

          mismatch = False
          for key, expected in checks:
              bin_val = binary.get(key, '__MISSING__')
              prof_val = profile.get(key, '__MISSING__')
              print(f'  {key}')
              print(f'    binary:  {bin_val}')
              print(f'    profile: {prof_val}')
              if bin_val != prof_val:
                  print(f'    MISMATCH (binary != profile)')
                  mismatch = True
              elif expected is not None and bin_val != expected:
                  print(f'    MISMATCH (expected {expected})')
                  mismatch = True
              else:
                  print(f'    OK')

          print()
          if not mismatch:
              print('Entitlements match: PASS')
          else:
              print('FAIL: Binary entitlements do not match provisioning profile')
              sys.exit(1)
          "

          echo ""
          echo "============================================"
          echo " ALL 14 VERIFICATION CHECKS PASSED "
          echo "============================================"
          cd ..

      - name: Upload .ipa to App Store Connect
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
        run: |
          fastlane upload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: EVChargeMan.ipa
          path: build/*.ipa
