name: Build & Upload iOS (.ipa)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  BUNDLE_ID: com.chargeman.app
  APPLE_ID: ${{ secrets.APPLE_ID || 'director@evgracias.com' }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'QDG4B42LM2' }}
  FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APP_STORE_CERT_P12: ${{ secrets.APP_STORE_CERT_P12 }}
  APP_STORE_CERT_P12_PASSWORD: ${{ secrets.APP_STORE_CERT_P12_PASSWORD }}
  APP_STORE_PROFILE_B64: ${{ secrets.APP_STORE_PROFILE_B64 }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install npm dependencies
        run: npm install

      - name: Build web app and add iOS platform
        run: |
          npm run build -- --prod
          npx cap add ios
          cp fastlane/ios-Podfile.template ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" ios/App/App.xcodeproj/project.pbxproj
          echo "=== Podfile platform line (must be 15.0): ==="
          grep "platform :ios" ios/App/Podfile
          echo "=== Podfile head: ==="
          head -3 ios/App/Podfile
          echo "=== pbxproj deployment targets: ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj
          test "$(grep -c 'platform :ios, .15.0.' ios/App/Podfile)" = "1" || { echo "FAIL: Podfile platform is not 15.0"; exit 1; }
          npx cap sync ios

      - name: Set up Fastlane
        run: |
          if ! command -v fastlane &>/dev/null; then gem install fastlane -NV; fi
          fastlane --version

      - name: Install signing identity (or generate a new one)
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain"

          if [ -n "$APP_STORE_CERT_P12" ]; then
            echo "Reusing existing certificate and provisioning profile from secrets."
            echo "$APP_STORE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APP_STORE_CERT_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_FILE="$HOME/Library/MobileDevice/Provisioning Profiles/EVChargeMan_AppStore.mobileprovision"
            echo "$APP_STORE_PROFILE_B64" | base64 --decode > "$PROFILE_FILE"
          else
            echo "Generating new certificate and provisioning profile with Fastlane..."
            fastlane generate_signing
            PROFILE_FILE="$(ls certificates/*.mobileprovision | head -1)"
            mkdir -p "$RUNNER_TEMP/certs_out"
            cp certificates/*.p12 certificates/*.mobileprovision "$RUNNER_TEMP/certs_out/"
          fi

          SPECIFIER="$(security cms -D -i "$PROFILE_FILE" 2>/dev/null | plutil -extract Name raw -)"
          echo "PROFILE_SPECIFIER=$SPECIFIER" >> "$GITHUB_ENV"

      - name: Save generated signing files for reuse (first run only)
        if: env.APP_STORE_CERT_P12 == ''
        uses: actions/upload-artifact@v5
        with:
          name: apple-signing-files
          path: ${{ runner.temp }}/certs_out

      - name: Build .ipa and upload to App Store Connect
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
        run: |
          fastlane release

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: EVChargeMan.ipa
          path: build/*.ipa
