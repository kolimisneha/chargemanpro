<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content menu-content>
        <ion-list id="inbox-list" menu-list>
          <ion-menu-toggle auto-hide="false">
            <div profile-container>
              <img [src]="menuAvatarIcon"/>

              <div profile-name-container (click)="openProfile()">
                <ion-label>Profile</ion-label>
                <ion-icon [src]="profileIcon"></ion-icon>
                <div>
                <ion-label>{{userName}}</ion-label>
              </div>
              </div>
            </div>
           
            <ion-item *ngFor="let item of menuItems" lines="none" (click)="routeTo(item.url)">
              <ion-label>{{item.title}}</ion-label>
              <ion-icon [src]="item.icon" slot="end"></ion-icon>
            </ion-item>
            <ion-item lines="none" (click)="logout()">
              <ion-label>Logout</ion-label>
              <ion-icon [src]="logoutIcon" slot="end"></ion-icon>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
      <div menu-footer-image-container>
      <img src="../../assets/icon/menu_bottom_logo.svg"/>
    </div>
    <div version-container>
      <ion-label>V {{appVersionNumber}}</ion-label>
    </div>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
