<app-header title="Support" redirectTo='dashboard' iconPath="../../../assets/icon/back_icon.svg"></app-header>


<ion-content content-color>
  
  <div support-container>
    <ion-item lines="none" support-item (click)="openSupport('email')">    
    <ion-label>{{chargemenEmail}}</ion-label>
    <ion-icon name="mail-outline" slot="start"></ion-icon>
  </ion-item>

  <ion-item lines="none" support-item (click)="openSupport('call')">    
    <ion-label>{{chargemenContact}}</ion-label>
    <ion-icon name="call-outline" slot="start"></ion-icon>
  </ion-item>

  <ion-item lines="none" support-item (click)="openSupport('website')">    
    <ion-label>{{chargeManWebSite}}</ion-label>
    <ion-icon name="information-circle-outline" slot="start"></ion-icon>
  </ion-item>

  <ion-item lines="none" support-item (click)="openSupport('terms')">    
    <ion-label>Terms & Conditions</ion-label>
    <ion-icon name="document-text-outline" slot="start"></ion-icon>
  </ion-item>

  <ion-item lines="none" support-item (click)="openSupport('privacy')">    
    <ion-label>Our Privacy Policy</ion-label>
    <ion-icon name="document-text-outline" slot="start"></ion-icon>
  </ion-item>
  </div>

</ion-content>
